# deploy/mediacms.service no longer reads this file. The mediacms unit of the
# uWSGI releases starts `uwsgi --ini` with it, and the restart_script.sh of those
# releases restarts that unit when a deploy to this release stops before
# deploy/apply-release-config.sh installs the gunicorn unit. Delete this file in
# a release after the gunicorn one, once no host can deploy from a uWSGI release.
[uwsgi]

chdir           = /home/cinemata/cinematacms/
# The unit of the last uWSGI release passes --virtualenv /home/cinemata/venv
# after --ini, which replaces this. A unit installed before that release reads it.
virtualenv = /home/cinemata
module          = cms.wsgi

uid=www-data
gid=www-data

processes = 10
threads = 10

master          = true
die-on-term     = true

socket = 127.0.0.1:9000

workers = 8
if-env = CINEMATA_WEB_WORKERS
workers = %(_)
endif =
master = true

lazy-apps = true

vacuum          = true

logto = /home/cinemata/cinematacms/logs/errorlog.txt
touch-logreopen = /home/cinemata/cinematacms/logs/.uwsgi-logreopen

disable-logging = true
