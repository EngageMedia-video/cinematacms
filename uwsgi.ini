[uwsgi]

chdir           = /home/cinemata/cinematacms/
virtualenv = /home/cinemata
module          = cms.wsgi

uid=www-data
gid=www-data

processes = 10
threads = 10

master          = true

socket = 127.0.0.1:9000

workers = 8
master = true

# Each worker loads the application itself instead of inheriting it from a
# preforked master. cms/wsgi.py keys the prometheus multiprocess files by uWSGI
# worker id, and under preforking it runs once in the master, so metrics built
# at import time stay in the master's file and several workers write to it at
# once. Costs the copy-on-write memory sharing a preforked master would give.
lazy-apps = true

vacuum          = true

logto = /home/cinemata/cinematacms/logs/errorlog.txt

disable-logging = true
