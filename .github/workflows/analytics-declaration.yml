name: Analytics declaration

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: analytics-declaration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  declaration:
    name: Validate analytics declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout the validator from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Validate the Analytics section
        id: validation
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node .github/scripts/analytics-declaration.mjs

      - name: Update the PR commit status
        if: always()
        uses: actions/github-script@v7
        env:
          VALID: ${{ steps.validation.outputs.valid }}
          MESSAGE: ${{ steps.validation.outputs.message }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const valid = process.env.VALID === 'true';
            const message = process.env.MESSAGE || 'Analytics declaration could not be validated.';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.payload.pull_request.head.sha,
              state: valid ? 'success' : 'failure',
              context: 'Analytics declaration',
              description: message,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });

            if (!valid) core.setFailed(message);
