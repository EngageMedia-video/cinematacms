[uwsgi]

chdir           = /home/cinemata/cinematacms/
virtualenv = /home/cinemata
module          = cms.wsgi

uid=www-data
gid=www-data

processes = 10
threads = 10

master          = true
die-on-term     = true

socket = 127.0.0.1:9000

workers = 8
master = true


vacuum          = true

logto = /home/cinemata/cinematacms/logs/errorlog.txt
# deploy/observability/templates/app-logs.logrotate touches this file after it renames the log.
touch-logreopen = /home/cinemata/cinematacms/logs/.uwsgi-logreopen
