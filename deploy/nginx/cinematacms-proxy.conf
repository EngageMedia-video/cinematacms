# Managed by CinemataCMS deployment tooling.
# Request headers for every location that passes to the application server.
# The application trusts X-Real-IP and X-Forwarded-Proto only from a loopback
# peer, so each line must replace whatever the client sent.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $cinematacms_forwarded_proto;
