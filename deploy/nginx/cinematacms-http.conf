# Managed by CinemataCMS deployment tooling.
client_body_timeout 300s;

# Fine Uploader's per-file id, sent by the browser on every upload chunk. It is
# client-controlled, so only a version-4 UUID is logged; anything else logs "-".
map $http_x_upload_id $cinematacms_upload_id {
    default "-";
    "~^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" $http_x_upload_id;
}

log_format cinematacms '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" "$gzip_ratio" '
                         'rt=$request_time urt=$upstream_response_time rl=$request_length uid=$cinematacms_upload_id';

# Rate-limit by client network, matching the application limiters: an IPv4
# address, or the first four groups (/64) of an IPv6 address. realip has
# already replaced $remote_addr with the client address behind Cloudflare.
# ponytail: the regex reads nginx's compressed IPv6 form, so an address with
# "::" inside its first four groups keys on the full address. Use njs if those
# prefixes need /64 grouping.
map $remote_addr $cinematacms_client_network {
    "~^(?<cinematacms_ipv6_64>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $cinematacms_ipv6_64;
    default $remote_addr;
}

limit_req_zone $cinematacms_client_network zone=cinematacms_view:10m rate=10r/s;
limit_req_zone $cinematacms_client_network zone=cinematacms_actions:10m rate=5r/s;
limit_req_zone $cinematacms_client_network zone=cinematacms_password:10m rate=1r/s;
limit_req_status 429;
