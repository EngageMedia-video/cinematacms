# Managed by CinemataCMS deployment tooling.
# The address gunicorn listens on. deploy/gunicorn.conf.py binds the server named
# here. It is not the uWSGI socket of earlier releases, 127.0.0.1:9000: nginx
# running a site that still passes uwsgi requests there finds no listener and
# answers 502 at once, where gunicorn would wait for an HTTP request line.
upstream cinematacms_app {
    server 127.0.0.1:9001;
}
