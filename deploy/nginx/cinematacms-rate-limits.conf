# Edge rate limits per client network; zones live in cinematacms-http.conf.
# Bursts absorb a classroom behind one NAT address loading a film together.
# The application limiters still apply behind these.
location = /view {
    limit_req zone=cinematacms_view burst=40 nodelay;

    include /etc/nginx/sites-enabled/uwsgi_params;
    uwsgi_pass 127.0.0.1:9000;
}

location ~ ^/api/v1/media/[^/]+/actions$ {
    limit_req zone=cinematacms_actions burst=20 nodelay;

    include /etc/nginx/sites-enabled/uwsgi_params;
    uwsgi_pass 127.0.0.1:9000;
}

location ~ ^/api/v1/media/[^/]+/password$ {
    limit_req zone=cinematacms_password burst=10 nodelay;

    include /etc/nginx/sites-enabled/uwsgi_params;
    uwsgi_pass 127.0.0.1:9000;
}
