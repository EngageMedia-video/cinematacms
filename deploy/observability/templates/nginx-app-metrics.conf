server {
    listen 127.0.0.1:${APP_METRICS_PORT};
    server_name localhost;

    # The headers of deploy/nginx/cinematacms-proxy.conf. This file can be
    # installed before that snippet exists, so it does not include it. No proxy
    # reaches this loopback listener, so the scheme is always the one nginx saw.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /metrics {
        proxy_pass http://127.0.0.1:9000;
    }

    location = /internal/observability/references {
        proxy_pass http://127.0.0.1:9000;
    }

    location / {
        return 404;
    }
}
