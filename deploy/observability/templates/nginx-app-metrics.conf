server {
    listen 127.0.0.1:${APP_METRICS_PORT};
    server_name localhost;

    location = /metrics {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:9000;
    }

    location = /internal/observability/references {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:9000;
    }

    location / {
        return 404;
    }
}
