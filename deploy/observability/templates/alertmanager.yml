global:
  resolve_timeout: 5m

route:
  receiver: ${ALERT_RECEIVER}
  group_by: [alertname, severity, service_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      repeat_interval: 1h

receivers:
  - name: "null"
  - name: email
    email_configs:
      - to: ${SMTP_TO}
        from: ${SMTP_FROM}
        smarthost: ${SMTP_SMARTHOST}
        auth_username: ${SMTP_USER}
        auth_password: ${SMTP_PASSWORD}
        require_tls: true
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, service_name]
