apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://127.0.0.1:8428
    isDefault: true
    editable: false
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://127.0.0.1:9428
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id[=:]"?([a-f0-9]{32})'
          datasourceUid: victoriatraces
          url: '$${__value.raw}'
  - name: VictoriaTraces
    uid: victoriatraces
    type: jaeger
    access: proxy
    url: http://127.0.0.1:10428/select/jaeger
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: 'trace_id:"$${__trace.traceId}"'
  - name: Incident Reference Lookup
    uid: incident-reference-lookup
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: ${INCIDENT_REFERENCE_LOOKUP_URL}
    editable: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - ${INCIDENT_REFERENCE_LOOKUP_ORIGIN}
    secureJsonData:
      bearerToken: ${INCIDENT_REFERENCE_LOOKUP_TOKEN}

deleteDatasources:
  - name: Prometheus
    orgId: 1
