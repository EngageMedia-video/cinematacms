# Cloudflare sits in front of production. Without this, $remote_addr is a
# Cloudflare edge address for every visitor: /metrics and the health endpoints
# cannot tell localhost from the public internet, and the IP-keyed limits
# (restricted-media password attempts, view counting) bucket the whole world
# into a handful of edge IPs.
#
# CF-Connecting-IP holds a single address written by Cloudflare, so unlike
# X-Forwarded-For there is nothing for a caller to prepend. Trusting it only
# from the ranges below means a request that reaches nginx directly keeps its
# real peer address.
#
# These ranges change. Refresh from https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6, then `nginx -t && systemctl reload nginx`.
# Last refreshed: 2026-08-27.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
