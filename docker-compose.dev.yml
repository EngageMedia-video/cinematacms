services:
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/

    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: mediacms
      POSTGRES_DB: mediacms
      TZ: Europe/London
    ports:
      - "5432:5432"
    networks:
      - cinemata_network

  test-db:
    image: postgres:14-alpine
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: mediacms
      POSTGRES_DB: mediacms
      TZ: Europe/London
    ports:
      - "${TEST_DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediacms -d mediacms"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - cinemata_network

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      TZ: Europe/London
    networks:
      - cinemata_network

